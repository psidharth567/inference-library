[project]
name = "inference-lib"
version = "0.2.0"
description = "Standalone vLLM serving (Docker) + resumable multi-format batch generation for 8xH100 nodes"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "tqdm>=4.60.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "huggingface-hub>=0.25.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]
parquet = ["pandas>=2.0", "pyarrow>=14.0"]

[project.scripts]
inference = "inference_lib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_lib"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/inference_lib/encoding"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

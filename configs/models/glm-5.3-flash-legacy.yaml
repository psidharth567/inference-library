hf_repo: zai-org/GLM-5.3-Flash
description: GLM 5.3 Flash on the legacy pre-0.30 stack
# Local-only image (not on any registry): vllm/vllm-openai:glm53-flash (vLLM nightly
# 0.1.dev20051+g487ecf187, torch 2.13.0+cu130, transformers 5.15.1, FlashInfer 0.6.17) plus env
# baked in (VLLM_USE_BREAKABLE_CUDAGRAPH=0, VLLM_ALLREDUCE_USE_FLASHINFER=1, ...).
# Image id sha256:6a5c3471f919...; copy it to a node with scripts/copy_image.sh.
image: toolkit/inference-glm53:12.8
keep_image_env: true
served_model_name: zai-org/GLM-5.3-Flash
tensor_parallel_size: 8
enable_expert_parallel: true
recommended_gpus: 8
max_model_len: 98304
gpu_memory_utilization: 0.85
max_num_seqs: 64
max_num_batched_tokens: 32768
kv_cache_dtype: auto
reasoning_parser: glm45
tool_call_parser: glm47
trust_remote_code: true
vllm_args: ["--enable-prefix-caching"]

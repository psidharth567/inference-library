hf_repo: allenai/OLMo-2-1124-7B
description: OLMo 2 7B base (pretrained, no chat template)
# TP1 x DP8: 2.62k out tok/s/GPU vs 2.51k at TP2 (no GQA: KV-cache bound)
tensor_parallel_size: 1
recommended_gpus: 8
max_model_len: 4096
# Base model, no chat template: messages are joined as raw text and the model continues it
vllm_args:
  - "--chat-template={%- for m in messages -%}{{ m['content'] }}{%- if not loop.last -%}{{ '\\n\\n' }}{%- endif -%}{%- endfor -%}"
